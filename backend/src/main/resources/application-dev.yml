spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleetcommand}
    username: ${DB_USERNAME:fleetcommand}
    password: ${DB_PASSWORD:fleetcommand}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
