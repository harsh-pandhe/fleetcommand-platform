spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fleetcommand
    username: fleetcommand
    password: fleetcommand
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
